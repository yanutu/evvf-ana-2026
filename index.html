// Canvas animation — confetti dorés + étincelles
(function(){
  const canvas=document.getElementById('bg');
  const ctx=canvas.getContext('2d');
  function resize(){canvas.width=window.innerWidth;canvas.height=window.innerHeight;}
  resize(); window.addEventListener('resize',resize);
  const GOLD=['#C9A86C','#D4AF6A','#E8D5A3','#B8923E','#F0E0B0','#fff'];
  const particles=[];
  for(let i=0;i<55;i++){
    const isSquare=Math.random()>.6;
    particles.push({
      x:Math.random()*window.innerWidth,
      y:Math.random()*window.innerHeight,
      size:isSquare?2+Math.random()*4:0.8+Math.random()*2,
      color:GOLD[Math.floor(Math.random()*GOLD.length)],
      vy:-(0.15+Math.random()*.5),
      vx:(Math.random()-.5)*.4,
      alpha:Math.random()*.8,
      alphaDir:Math.random()>.5?.004:-.004,
      phase:Math.random()*Math.PI*2,
      isSquare,
      rot:Math.random()*Math.PI,
      rotV:(Math.random()-.5)*.02
    });
  }
  function animate(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    const now=Date.now()/1000;
    for(const p of particles){
      p.alpha+=p.alphaDir;
      if(p.alpha>=.8||p.alpha<=.05)p.alphaDir*=-1;
      p.x+=p.vx+Math.sin(now*.5+p.phase)*.4;
      p.y+=p.vy;
      if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width;}
      ctx.save();
      ctx.globalAlpha=p.alpha*.6;
      ctx.translate(p.x,p.y);
      if(p.isSquare){
        p.rot+=p.rotV;
        ctx.rotate(p.rot);
        ctx.fillStyle=p.color;
        ctx.fillRect(-p.size/2,-p.size/2,p.size,p.size);
      } else {
        ctx.beginPath();
        ctx.arc(0,0,p.size,0,Math.PI*2);
        ctx.fillStyle=p.color;
        ctx.fill();
        // halo
        const g=ctx.createRadialGradient(0,0,0,0,0,p.size*3);
        g.addColorStop(0,'rgba(201,168,108,0.2)');
        g.addColorStop(1,'transparent');
        ctx.fillStyle=g;
        ctx.beginPath();
        ctx.arc(0,0,p.size*3,0,Math.PI*2);
        ctx.fill();
      }
      ctx.restore();
    }
    requestAnimationFrame(animate);
  }
  animate();
})();

function compress(file){
  return new Promise(res=>{
    const r=new FileReader();
    r.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas'),max=900;
        let w=img.width,h=img.height;
        if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max;}else{w=Math.round(w*max/h);h=max;}}
        c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
        res(c.toDataURL('image/jpeg',.72));
      };
      img.src=e.target.result;
    };
    r.readAsDataURL(file);
  });
}

  render();

  const{error}=await db.from('evjf_photos').insert({
    name,message,image_data:form.imageData,
    moment:form.moment,defis:form.defis.join(', '),likes:0
  });
  if(error){
    document.getElementById('f-err').textContent='Erreur. Photo trop grande ?';
    btn.disabled=false;btn.textContent='Partager ce moment 🥂';
  }else{
    form={name:'',message:'',imageData:null,preview:null,moment:'',defis:[]};
    showView('gallery');
  }
}

function startSlideshow(){
  const f=fp();if(!f.length)return;
  slideIdx=0;
  document.getElementById('slideshow').style.display='flex';
  updateSlide();
  slideTimer=setInterval(()=>{slideIdx=(slideIdx+1)%f.length;updateSlide();},3500);
}
function stopSlideshow(){clearInterval(slideTimer);document.getElementById('slideshow').style.display='none';}
function updateSlide(){
  const f=fp(),p=f[slideIdx];
  document.getElementById('slide-img').src=p.image_data;
  document.getElementById('slide-name').textContent=p.name;
  document.getElementById('slide-msg').textContent=p.message?'"'+p.message+'"':'';
  document.getElementById('slide-dots').innerHTML=f.map((_,i)=>`<div class="dot${i===slideIdx?' active':''}" onclick="goSlide(${i})"></div>`).join('');
}
function slidePrev(){const f=fp();slideIdx=(slideIdx-1+f.length)%f.length;updateSlide();}
function slideNext(){const f=fp();slideIdx=(slideIdx+1)%f.length;updateSlide();}
function goSlide(i){slideIdx=i;updateSlide();}

function downloadQR(){
  const a=document.createElement('a');
  a.download='qr-evjf-ana.png';
  a.href='data:image/png;base64,'+QR;
  a.click();
}

function render(){
  const app=document.getElementById('app');

  if(view==='gallery'){
    const f=fp();
    app.innerHTML=`
      <div class="filters">
        ${['Tous',...MOMENTS].map(m=>`<button class="filter-btn${filter===m?' active':''}" onclick="setFilter('${m}')">${m}</button>`).join('')}
      </div>
      <div class="counter">${photos.length} souvenir${photos.length!==1?'s':''} · ${f.length} affiché${f.length!==1?'s':''}</div>
      ${f.length===0?`<div class="empty"><p>Aucune photo encore…<br/>Soyez les premières à immortaliser la soirée ! 🥂</p><button class="btn-fill" onclick="showView('upload')">📸 Ajouter</button></div>`:`
      <div class="mosaic">${f.map(p=>`
        <div class="mosaic-item" onclick="openPhoto(${photos.indexOf(p)})">
          <img src="${p.image_data}" alt=""/>
          <button class="like-btn" onclick="likePhoto(event,'${p.id}')">♥ ${p.likes||0}</button>
          ${p.defis?`<div class="defi-badge">Défi ✓</div>`:''}
          <div class="mosaic-overlay">
            ${p.moment?`<span class="m-tag">${p.moment}</span><br/>`:''}
            <p class="m-name">${p.name}</p>
            ${p.message?`<p class="m-msg">"${p.message}"</p>`:''}
          </div>
        </div>`).join('')}
      </div>`}`;
  }

  if(view==='upload'){
    app.innerHTML=`
      <div class="page">
        <button class="btn" onclick="showView('gallery')" style="margin-bottom:28px">← Retour</button>
        <div class="page-head"><p class="sup">✦ votre souvenir ✦</p><h2>Partager</h2></div>
        ${!form.preview?`
          <div class="drop-zone" onclick="document.getElementById('fi').click()">
            <div style="font-size:28px;margin-bottom:10px">📸</div>
            <p style="font-size:14px;margin-bottom:4px;color:#111">Cliquez pour choisir une photo</p>
            <small style="color:#333;font-size:11px;letter-spacing:1px">JPG, PNG</small>
            <input id="fi" type="file" accept="image/*" style="display:none" onchange="handleFile(event)"/>
          </div>`:`
          <div class="preview-wrap">
            <img src="${form.preview}" alt=""/>
            <button class="rm-btn" onclick="removePreview()">✕</button>
          </div>`}
        <div class="fields">
          <div class="field"><label>Votre prénom *</label><input id="f-name" placeholder="Ex : Sophie"/></div>
          <div class="field"><label>Moment de la soirée</label>
            <div class="grid2">${MOMENTS.map(m=>`<div class="opt${form.moment===m?' sel':''}" onclick="selectMoment('${m}')">${m}</div>`).join('')}</div>
          </div>
          <div class="field"><label>Défis accomplis 🎯</label>
            <div class="defi-opts">${DEFIS.map(d=>`
              <div class="defi-opt${form.defis.includes(d)?' sel':''}" onclick="toggleDefi('${d}')">
                <div class="check">${form.defis.includes(d)?'✓':''}</div>
                <span>${d}</span>
              </div>`).join('')}
            </div>
          </div>
          <div class="field"><label>Un mot / une dédicace</label><textarea id="f-message" rows="3" placeholder="Ce moment était… 😄"></textarea></div>
          <p id="f-err" class="err"></p>
          <button id="submit-btn" class="btn-fill" onclick="handleSubmit()" ${!form.imageData?'disabled':''} style="padding:14px;font-size:11px;letter-spacing:3px;margin-top:6px">Partager ce moment 🥂</button>
        </div>
      </div>`;
  }

  if(view==='votes'){
    const sorted=[...photos].sort((a,b)=>(b.likes||0)-(a.likes||0));
    const max=sorted.length?sorted[0].likes||1:1;
    app.innerHTML=`
      <div class="page" style="max-width:700px">
        <div class="page-head"><p class="sup">✦ classement ✦</p><h2>Top Photos</h2></div>
        ${sorted.length===0?`<p style="text-align:center;color:#333;font-style:italic;padding:40px">Aucun vote encore !</p>`:`
        <div style="display:flex;flex-direction:column;gap:12px">
          ${sorted.slice(0,10).map((p,i)=>`
            <div style="display:flex;align-items:center;gap:14px;background:#F5F0E8;border:1px solid #E8E0D0;padding:12px;cursor:pointer" onclick="openPhoto(${photos.indexOf(p)})">
              <div style="font-family:'Playfair Display',serif;font-size:22px;color:${i===0?'var(--gold)':i===1?'#aaa':i===2?'#cd7f32':'#555'};font-style:italic;min-width:28px">${i+1}</div>
              <img src="${p.image_data}" style="width:60px;height:60px;object-fit:cover;border:1px solid #E8E0D0"/>
              <div style="flex:1">
                <p style="font-size:12px;letter-spacing:1px;color:#222;margin-bottom:4px">${p.name}</p>
                ${p.moment?`<p style="font-size:9px;letter-spacing:2px;color:var(--gold);text-transform:uppercase">${p.moment}</p>`:''}
                <div style="margin-top:6px;height:3px;background:#E8E0D0;border-radius:2px">
                  <div style="height:100%;background:var(--gold);border-radius:2px;width:${Math.round((p.likes||0)/max*100)}%"></div>
                </div>
              </div>
              <div style="color:var(--gold);font-size:13px;font-weight:600;min-width:40px;text-align:right">♥ ${p.likes||0}</div>
            </div>`).join('')}
        </div>`}
      </div>`;
  }

  if(view==='lightbox'&&selectedPhoto){
    const p=selectedPhoto;
    app.innerHTML=`
      <div class="lightbox">
        <button class="btn" onclick="showView('gallery')" style="margin-bottom:24px">← Retour</button>
        <img src="${p.image_data}" style="width:100%;max-height:62vh;object-fit:contain;display:block;border:1px solid #E8E0D0"/>
        <div style="text-align:center;margin-top:20px;padding:20px 0 0;border-top:1px solid #E8E0D0">
          ${p.moment?`<p style="font-size:9px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;margin-bottom:8px">${p.moment}</p>`:''}
          <p style="font-family:'Montserrat',sans-serif;font-size:13px;letter-spacing:1px;margin-bottom:6px">${p.name}</p>
          ${p.defis?`<p style="font-size:11px;color:var(--gold);letter-spacing:1px;margin-bottom:8px">Défis : ${p.defis}</p>`:''}
          ${p.message?`<p style="font-family:'Playfair Display',serif;font-style:italic;color:#333;font-size:16px;line-height:1.8">"${p.message}"</p>`:''}
          <button onclick="likePhoto(event,'${p.id}')" style="margin-top:16px;background:transparent;border:1px solid var(--gold);padding:9px 24px;font-family:'Montserrat',sans-serif;font-size:12px;cursor:pointer;color:var(--gold);letter-spacing:2px;transition:all .2s">♥ ${p.likes||0} vote${(p.likes||0)!==1?'s':''}</button>
        </div>
      </div>`;
  }

  if(view==='qr'){
    app.innerHTML=`
      <div class="page" style="text-align:center">
        <button class="btn" onclick="showView('gallery')" style="margin-bottom:28px">← Retour</button>
        <div class="page-head"><p class="sup">✦ partagez ✦</p><h2>QR Code</h2></div>
        <div class="qr-box">
          <img src="data:image/png;base64,${QR}" style="width:220px;height:220px;display:block;margin:0 auto 20px"/>
          <p style="font-size:11px;letter-spacing:2px;color:#333;margin-bottom:16px;text-transform:uppercase">yanutu.github.io/evvf-ana-2026</p>
          <p style="font-family:'Playfair Display',serif;font-style:italic;color:#111;font-size:14px;line-height:1.8;margin-bottom:22px">Scannez pour accéder à la galerie<br/>et partager vos photos de la soirée !</p>
          <button class="btn-fill" onclick="downloadQR()" style="padding:12px 28px">Télécharger</button>
        </div>
      </div>`;
  }
}

loadPhotos();
</script>
</body>
</html>
